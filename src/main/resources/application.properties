spring.application.name=be-interview-prep
app.version=@project.version@
spring.jpa.open-in-view=false
booking.hold-duration=PT5M
booking.slot-duration=PT30M
booking.sweep-interval=PT10S

app.file-upload.directory=${FILE_STORAGE_DIR:./uploads}
app.file-upload.max-size=5MB
spring.servlet.multipart.max-file-size=${app.file-upload.max-size}
spring.servlet.multipart.max-request-size=6MB

ratelimit.max-requests=10
ratelimit.window=60s
ratelimit.store=database

library.loan-period=P14D
